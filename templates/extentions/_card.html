<div class="single-post row">
    <div class="col-lg-3  col-md-3 meta-details">
        <div class="user-details row">
            <p class="user-name col-lg-12 col-md-12 col-6">
                <a href="#">
                    {% if p.author %}
                    {{p.author.name}}
                    {% else %}
                    بدون نام
                    {% endif %}
                </a> <span class="lnr lnr-user"></span>
            </p>
            <p class="date col-lg-12 col-md-12 col-6"><a href="#">{{ p.create_at }}</a> <span
                    class="lnr lnr-calendar-full"></span></p>
            <p class="view col-lg-12 col-md-12 col-6"><a href="#">{{p.count_view}}</a> <span class="lnr lnr-eye"></span>
            </p>
            <p class="comments col-lg-12 col-md-12 col-6"><a href="#">06 Comments</a> <span
                    class="lnr lnr-bubble"></span></p>
            <p class="comments col-lg-12 col-md-12 col-6"><a href="#">
                    {% for i in p.category.all %}
                    <span>{{i.name}}</span>
                    {% endfor%}
                </a></p>
        </div>
    </div>
    <div class="col-lg-9 col-md-9 ">
        <div class="feature-img">
            <img class="img-fluid" src="{{p.image.url}}" alt="">
        </div>
        <a class="posts-title" href="{% url 'blog:single' name=p.slug %}">
            <h3>{{p.title}}</h3>
        </a>
        <p class="excert">
            {{p.content}}
        </p>
        <a href="{% url 'blog:single' name=p.slug %}" class="primary-btn">View More</a>
    </div>
</div>
